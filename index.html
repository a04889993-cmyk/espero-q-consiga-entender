<!DOCTYPE html><html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Quadrado e Retângulo</title><style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#11152b,#252b55);
  color:white;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.container{
  width:100%;
  max-width:1000px;
  background:#171b35;
  padding:25px;
  border-radius:25px;
  box-shadow:0 10px 40px #0008;
}

h1{
  text-align:center;
  margin-bottom:5px;
}

p{
  text-align:center;
  color:#bfc4dc;
}

.video{
  display:block;
  width:100%;
  border-radius:18px;
  background:#000;
  margin-top:20px;
}

/* Botões ficam FORA do vídeo */
.botoes{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  margin-top:18px;
}

button{
  border:0;
  border-radius:12px;
  padding:12px 18px;
  background:#8175ff;
  color:white;
  font-weight:bold;
  font-size:15px;
  cursor:pointer;
  transition:transform 0.1s;
}

button:active{
  transform:scale(.96);
}

.info{
  text-align:center;
  margin-top:20px;
  color:#9fa6c5;
  font-size:14px;
}

@media (max-width:700px){
  body{
    padding:10px;
  }

  .container{
    padding:15px;
    border-radius:18px;
  }

  h1{
    font-size:24px;
  }

  button{
    padding:11px 14px;
    font-size:14px;
  }
}
</style></head><body><div class="container"><h1>📐 Quadrado e Retângulo</h1><p>Trabalho de Matemática</p><!--
  controls NÃO está presente.
  Portanto, o botão redondo de pausa do navegador
  não aparece sobre o vídeo.
--><video id="video" class="video" playsinline preload="metadata">
  <source src="trabalho.mp4" type="video/mp4">
  Seu navegador não conseguiu carregar o vídeo.
</video><div class="botoes">  <button id="btnPausar" onclick="pausar()">
    ⏸ Pausar
  </button>  <button onclick="voltar()">
    ↶ Voltar 5s
  </button>  <button onclick="avancar()">
    Avançar 5s ↷
  </button>  <button onclick="reiniciar()">
    ↺ Reiniciar
  </button></div><div class="info">
💡 Use os botões abaixo do vídeo para controlar a apresentação.
</div></div><script>

const video = document.getElementById("video");
const btnPausar = document.getElementById("btnPausar");

function atualizarBotao(){

  if(video.paused){
    btnPausar.textContent = "▶ Continuar";
  }else{
    btnPausar.textContent = "⏸ Pausar";
  }

}

function pausar(){

  if(video.paused){
    video.play().catch(function(){
      console.log("O navegador bloqueou a reprodução automática.");
    });
  }else{
    video.pause();
  }

  atualizarBotao();

}

function voltar(){

  video.currentTime = Math.max(
    0,
    video.currentTime - 5
  );

}

function avancar(){

  if(Number.isFinite(video.duration)){

    video.currentTime = Math.min(
      video.duration,
      video.currentTime + 5
    );

  }

}

function reiniciar(){

  video.currentTime = 0;
  video.pause();

  atualizarBotao();

}

video.addEventListener("play", atualizarBotao);
video.addEventListener("pause", atualizarBotao);
video.addEventListener("ended", atualizarBotao);

atualizarBotao();

</script></body>
</html>
