
    <!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quadrado e Retângulo</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#11152b,#252b55);
  color:white;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.container{
  width:100%;
  max-width:1000px;
  background:#171b35;
  padding:25px;
  border-radius:25px;
  box-shadow:0 10px 40px #0008;
}

h1{
  text-align:center;
  margin-bottom:5px;
}

p{
  text-align:center;
  color:#bfc4dc;
}

.video{
  width:100%;
  border-radius:18px;
  background:#000;
  margin-top:20px;
}

/* Controles ficam escondidos */
.botoes{
  display:none;
}

.info{
  text-align:center;
  margin-top:20px;
  color:#9fa6c5;
  font-size:14px;
}

/* Esconde os controles nativos do vídeo */
.video::-webkit-media-controls{
  display:none !important;
}

.video::-webkit-media-controls-enclosure{
  display:none !important;
}

@media (max-width:700px){
  body{
    padding:10px;
  }

  .container{
    padding:15px;
    border-radius:18px;
  }

  h1{
    font-size:24px;
  }

  .info{
    font-size:12px;
  }
}
</style>
</head>

<body>

<div class="container">

<h1>📐 Quadrado e Retângulo</h1>

<p>Trabalho de Matemática</p>

<video id="video" class="video" playsinline>
  <source src="trabalho.mp4" type="video/mp4">
  Seu navegador não conseguiu carregar o vídeo.
</video>

<div class="botoes">
  <button onclick="pausar()">⏸ Pausar / Continuar</button>
  <button onclick="voltar()">↶ Voltar 5s</button>
  <button onclick="avancar()">Avançar 5s ↷</button>
  <button onclick="reiniciar()">↺ Reiniciar</button>
</div>

<div class="info">
💡 Pressione ESPAÇO para pausar ou continuar.
</div>

</div>

<script>

const video = document.getElementById("video");

function pausar(){
  if(video.paused){
    video.play();
  }else{
    video.pause();
  }
}

function voltar(){
  video.currentTime = Math.max(0, video.currentTime - 5);
}

function avancar(){
  if(video.duration){
    video.currentTime = Math.min(video.duration, video.currentTime + 5);
  }
}

function reiniciar(){
  video.currentTime = 0;
  video.pause();
}

/* Espaço pausa ou continua */
document.addEventListener("keydown", function(event){

  if(event.code === "Space"){
    event.preventDefault();
    pausar();
  }

});

</script>

</body>
</html>
