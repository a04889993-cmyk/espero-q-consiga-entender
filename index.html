<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quadrado e Retângulo</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#11152b,#252b55);
  color:white;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.container{
  width:100%;
  max-width:1000px;
  background:#171b35;
  padding:25px;
  border-radius:25px;
  box-shadow:0 10px 40px #0008;
}

h1{
  text-align:center;
  margin-bottom:5px;
}

p{
  text-align:center;
  color:#bfc4dc;
}

.video{
  width:100%;
  border-radius:18px;
  background:#000;
  margin-top:20px;
}

.botoes{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  margin-top:18px;
}

button{
  border:0;
  border-radius:12px;
  padding:12px 18px;
  background:#8175ff;
  color:white;
  font-weight:bold;
  font-size:15px;
}

button:active{
  transform:scale(.96);
}

.info{
  text-align:center;
  margin-top:20px;
  color:#9fa6c5;
  font-size:14px;
}
</style>
</head>

<body>

<div class="container">

<h1>📐 Quadrado e Retângulo</h1>

<p>Trabalho de Matemática</p>

<video id="video" class="video" controls>
  <source src="trabalho.mp4" type="video/mp4">
  Seu navegador não conseguiu carregar o vídeo.
</video>

<div class="botoes">

<button onclick="pausar()">⏸ Pausar / Continuar</button>

<button onclick="voltar()">↶ Voltar 5s</button>

<button onclick="avancar()">Avançar 5s ↷</button>

<button onclick="reiniciar()">↺ Reiniciar</button>

</div>

<div class="info">
💡 Durante a apresentação, você pode pausar o vídeo para explicar cada parte.
</div>

</div>

<script>

const video = document.getElementById("video");

function pausar(){
  if(video.paused){
    video.play();
  }else{
    video.pause();
  }
}

function voltar(){
  video.currentTime = Math.max(0, video.currentTime - 5);
}

function avancar(){
  video.currentTime = Math.min(video.duration, video.currentTime + 5);
}

function reiniciar(){
  video.currentTime = 0;
  video.pause();
}

</script>

</body>
</html>
